[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlapol"
version = "0.1.0"
description = "Testbed for VLA training and inference on limited hardware: MuJoCo pick-and-place with SmolVLA, and phone-based data collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2",
    "numpy",
]

[project.optional-dependencies]
# Phone-based data collection (recording, replay, tags). Not needed for the simulation.
phone = [
    "scipy",
    "opencv-python>=4.8",  # GUI build; ArUco is in the main module since 4.7
    "websockets>=13",
    "pyyaml",
]
# Demo collection, training, policy evaluation and LeRobot export. Not needed to run the env or the expert.
lerobot = ["lerobot[smolvla,training]==0.7.0"]
dev = ["pytest"]

[project.scripts]
vlapol-record = "vlapol.record:main"
vlapol-calibrate-gripper = "vlapol.calibrate_gripper:main"
vlapol-replay = "vlapol.replay:main"
vlapol-export-lerobot = "vlapol.export_lerobot:main"
vlapol-make-tags = "vlapol.tags:main"
vlapol-phone-check = "vlapol.phone.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlapol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
